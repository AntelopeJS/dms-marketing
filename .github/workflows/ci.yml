name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [next]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Two jobs in parallel so the wall clock is the slower of them, not the sum:
# the backend suite boots a real DMS, everything else is `pnpm run checks`
# (static checks and the layer tests). `ubuntu` gathers them under the name
# the branch protection knows.
jobs:
  ci:
    uses: AntelopeJS/.github/.github/workflows/ci-node.yml@v2
    with:
      docs-files: |
        README.md
        docs
        packages/dms-marketing/README.md
        packages/dms-marketing/docs
        packages/interface-dms-marketing/README.md
        packages/interface-dms-marketing/docs
      docs-typescript-project: packages/interface-dms-marketing/docs/tsconfig.json
      renovate-sync: false
      test-job: true
    permissions:
      contents: read

  # ci-node.yml exposes no outputs, so this copies its tier rule for the jobs
  # declared here: none on a draft or on the `next` to default branch pull
  # request, Windows only in the nightly.
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
      os: ${{ steps.tier.outputs.os }}
      run: ${{ steps.tier.outputs.run }}
    steps:
      - name: Pick the tier from the event, the target branch and the draft flag
        id: tier
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY: ${{ github.repository }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          case "$EVENT" in
            pull_request)
              if [[ "$BASE_REF" == "$DEFAULT_BRANCH" && "$HEAD_REPOSITORY" == "$REPOSITORY" && "$HEAD_REF" =~ ^(next|develop)$ ]]; then
                tier=none
              elif [[ "$DRAFT" == true ]]; then
                tier=draft
              elif [[ "$BASE_REF" == "$DEFAULT_BRANCH" ]]; then
                tier=full
              else
                tier=fast
              fi
              ;;
            push)
              if [[ "$REF_NAME" == "$DEFAULT_BRANCH" ]]; then tier=none; else tier=full; fi
              ;;
            schedule) tier=nightly ;;
            *) tier=full ;;
          esac

          run=true
          if [[ "$tier" == none || "$tier" == draft ]]; then
            run=false
          fi

          os='["ubuntu-latest"]'
          if [[ "$tier" == nightly ]]; then
            os='["ubuntu-latest","windows-latest"]'
          fi

          {
            echo "tier=${tier}"
            echo "run=${run}"
            echo "os=${os}"
          } >> "$GITHUB_OUTPUT"
          echo "Tier \`${tier}\`" >> "$GITHUB_STEP_SUMMARY"

  backend:
    needs: select
    if: needs.select.outputs.run == 'true'
    name: backend${{ matrix.os == 'windows-latest' && ' on Windows' || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.select.outputs.os) }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    steps:
      - name: Use LF line endings, symlinks and Git Bash for package scripts, as ci-node.yml does
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
          bash_path=$(cygpath -w /usr/bin/bash)
          echo "npm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"
          echo "pnpm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            packages/*/pnpm-lock.yaml

      # Backend-only job: do not install the Vue layer or playground. The
      # module reaches the interface package through a tarball, which pnpm's
      # filter graph does not follow, so the interface is selected by name.
      - run: pnpm install --filter @antelopejs/dms-marketing... --filter @antelopejs/interface-dms-marketing --frozen-lockfile

      # `ajs module test` packs and installs the package-sourced modules
      # (dms, api, auth-jwt...) into `.antelope/cache`, and mongodb-memory-server
      # downloads its mongod binary; both used to be fetched on every run.
      # Core installs each of them from its lockfile in antelope-lock/ and
      # reuses a cached module only when its version and its lockfile match
      # the record, so a restored folder installs the same dependencies as an
      # empty one; the key follows the pins and the records, not pnpm's
      # lockfiles.
      - uses: actions/cache@v4
        with:
          path: packages/dms-marketing/.antelope/cache
          key: antelope-${{ runner.os }}-${{ hashFiles('packages/dms-marketing/antelope.test.ts', 'packages/dms-marketing/antelope-lock/**') }}
          restore-keys: antelope-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          # The version pinned as MONGO_VERSION in antelope.test.ts.
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('packages/dms-marketing/antelope.test.ts') }}
          restore-keys: mongodb-binaries-${{ runner.os }}-

      # The only build of the job (interface first, then the module).
      # DMS_PREBUILT below makes the test script and the harness's
      # `installCommand` reuse it instead of building twice more.
      - run: pnpm --dir packages/dms-marketing build
      # `ajs module test .` boots the module against a real DMS, a
      # mongodb-memory replica set and the api module.
      - run: pnpm --dir packages/dms-marketing test:backend
        env:
          DMS_PREBUILT: "1"

  # Model-checks the ImportAnalytics claim and replay with TLC
  # (.agents/skills/formal-import-claim). Only the root package is installed:
  # the runner is @antelopejs/tooling-configs/formal.
  formal-import-claim:
    needs: select
    if: needs.select.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --filter dms-marketing-workspace --frozen-lockfile --ignore-scripts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/antelopejs-formal
          key: tla2tools-1.7.4

      - run: node .agents/skills/formal-import-claim/check.mjs

  # The journeys of e2e/ as a Playwright suite: the @smoke ones on the full
  # tier, every journey in shards on the nightly tier, nothing on a draft or
  # the fast tier. Its global setup prepares and starts one dms-control run.
  e2e:
    needs: select
    if: needs.select.outputs.tier == 'full' || needs.select.outputs.tier == 'nightly'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.select.outputs.tier == 'nightly' && '[1, 2]' || '[1]') }}
    env:
      TIER: ${{ needs.select.outputs.tier }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: echo "DMS_CONTROL_RUNS=${RUNNER_TEMP}/dms-runs" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            packages/*/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/mongodb-binaries
            ~/.cache/ms-playwright
            .agents/skills/verify-dms-marketing/playground/.antelope/cache
          key: e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', '.agents/skills/verify-dms-marketing/playground/antelope.config.ts') }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/dms-control/frontend
          key: dms-control-frontend-${{ github.sha }}
          restore-keys: dms-control-frontend-
      - name: Install Chromium and its system packages
        run: |
          if timeout 240 pnpm exec playwright install --with-deps --only-shell chromium; then
            exit 0
          fi
          echo "::warning::Chromium's system packages did not install: installing the browser alone"
          pnpm exec playwright install --only-shell chromium
      - if: env.TIER == 'full'
        run: pnpm e2e --grep @smoke
      - if: env.TIER == 'nightly'
        run: pnpm e2e --shard=${{ matrix.shard }}/2 --reporter=blob
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: e2e/blob-report
      # The declarations @antelopejs/dms/e2e publishes, built by the run's prepare.
      - if: success() || failure()
        run: pnpm exec tsc --noEmit -p e2e
      - if: always() && env.TIER == 'nightly'
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: e2e/blob-report
          retention-days: 3
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence-${{ matrix.shard }}
          path: |
            e2e/playwright-report
            e2e/test-results
            ${{ runner.temp }}/dms-runs/*/evidence
            ${{ runner.temp }}/dms-runs/*/logs
          retention-days: 7

  # One HTML and JSON report of the nightly shards.
  e2e-report:
    needs: [select, e2e]
    if: always() && needs.select.outputs.tier == 'nightly'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --filter dms-marketing-workspace --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: e2e/blob-reports
          merge-multiple: true
      - run: pnpm exec playwright merge-reports --reporter html,json e2e/blob-reports
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: e2e/playwright-report
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_JSON_OUTPUT_FILE: e2e/playwright-report/results.json
      - uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14

  # The job name the branch protection requires: green only when every job
  # above is, a job the tier skipped excepted. A draft pull request fails it,
  # so merge-when-green cannot merge on the draft run.
  ubuntu:
    if: always()
    needs: [select, ci, backend, formal-import-claim, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: >-
          needs.select.result != 'success' || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || needs.ci.result == 'skipped' || (needs.select.outputs.run == 'true' && (needs.backend.result == 'skipped' || needs.formal-import-claim.result == 'skipped')) || ((needs.select.outputs.tier == 'full' || needs.select.outputs.tier == 'nightly') && needs.e2e.result == 'skipped')
        run: exit 1
      - if: needs.select.outputs.tier == 'draft'
        run: |
          echo "::error::Draft pull request: only lint and typecheck ran. Mark it ready for review to run the tests."
          exit 1
  renovate-sync:
    if: >-
      github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      actions: write
      statuses: write
    uses: AntelopeJS/.github/.github/workflows/ci-renovate-sync.yml@v2
