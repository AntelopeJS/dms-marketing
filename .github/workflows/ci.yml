name: ci

on:
  push:
    branches:
      - main
  pull_request:

  workflow_dispatch: null
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Two jobs in parallel so the wall clock is the slower of them, not the sum:
# the backend suite boots a real DMS, everything else is `pnpm run checks`
# (static checks and the layer tests). `ubuntu` gathers them under the name
# the branch protection knows.
jobs:
  ci:
    uses: AntelopeJS/.github/.github/workflows/ci-node.yml@v1
    with:
      docs-files: |
        README.md
        docs
        packages/dms-marketing/README.md
        packages/dms-marketing/docs
        packages/interface-dms-marketing/README.md
        packages/interface-dms-marketing/docs
      docs-typescript-project: packages/interface-dms-marketing/docs/tsconfig.json
      renovate-sync: false
      test-job: true
    permissions:
      contents: read

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            packages/*/pnpm-lock.yaml

      # Backend-only job: do not install the Vue layer or playground. The
      # module reaches the interface package through a tarball, which pnpm's
      # filter graph does not follow, so the interface is selected by name.
      - run: pnpm install --filter @antelopejs/dms-marketing... --filter @antelopejs/interface-dms-marketing --frozen-lockfile

      # `ajs module test` packs and installs the package-sourced modules
      # (dms, api, auth-jwt...) into `.antelope/cache`, and mongodb-memory-server
      # downloads its mongod binary; both used to be fetched on every run.
      # Core fetches again a module whose version differs from the one
      # antelope.test.ts pins, so a lockfile bump does not change the key.
      # The modules' own dependencies are resolved when a module is installed
      # and never checked again: the ISO week in the key, also in restore-keys,
      # installs everything afresh once a week at most.
      - id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: packages/dms-marketing/.antelope/cache
          key: antelope-${{ runner.os }}-${{ steps.week.outputs.week }}-${{ hashFiles('packages/dms-marketing/antelope.test.ts') }}
          restore-keys: antelope-${{ runner.os }}-${{ steps.week.outputs.week }}-
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          # The version pinned as MONGO_VERSION in antelope.test.ts.
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('packages/dms-marketing/antelope.test.ts') }}
          restore-keys: mongodb-binaries-${{ runner.os }}-

      # The only build of the job (interface first, then the module).
      # DMS_PREBUILT below makes the test script and the harness's
      # `installCommand` reuse it instead of building twice more.
      - run: pnpm --dir packages/dms-marketing build
      # `ajs module test .` boots the module against a real DMS, a
      # mongodb-memory replica set and the api module.
      - run: pnpm --dir packages/dms-marketing test:backend
        env:
          DMS_PREBUILT: "1"

  # Model-checks the ImportAnalytics claim and replay with TLC
  # (.agents/skills/formal-import-claim). Only the root package is installed:
  # the runner is @antelopejs/tooling-configs/formal.
  formal-import-claim:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --filter dms-marketing-workspace --frozen-lockfile --ignore-scripts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/antelopejs-formal
          key: tla2tools-1.7.4

      - run: node .agents/skills/formal-import-claim/check.mjs

  # The job name the branch protection requires; it passes only when every
  # job above passed.
  ubuntu:
    if: always()
    needs: [ci, backend, formal-import-claim]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '${{ toJSON(needs) }}'
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false" ]
  renovate-sync:
    if: >-
      github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      actions: write
    uses: AntelopeJS/.github/.github/workflows/ci-renovate-sync.yml@v1
