name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      nightly:
        description: Run the nightly tier, with the Windows jobs and Stress
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Two jobs in parallel so the wall clock is the slower of them, not the sum:
# the backend suite boots a real DMS, everything else is `pnpm run checks`
# (static checks and the layer tests). `ubuntu` gathers them under the name
# the branch protection knows.
jobs:
  ci:
    uses: AntelopeJS/.github/.github/workflows/ci-node.yml@v2
    with:
      docs-files: |
        README.md
        docs
        packages/dms-marketing/README.md
        packages/dms-marketing/docs
        packages/interface-dms-marketing/README.md
        packages/interface-dms-marketing/docs
      docs-typescript-project: packages/interface-dms-marketing/docs/tsconfig.json
      module-locks: true
      renovate-sync: false
      test-job: true
      nightly: ${{ inputs.nightly == true }}
    permissions:
      contents: read

  # ci-node.yml exposes no outputs, so this copies its tier rule for the jobs
  # declared here: none on a draft or on the `next` to default branch pull
  # request, Windows only in the nightly.
  select:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
      windows: ${{ steps.tier.outputs.windows }}
      run: ${{ steps.tier.outputs.run }}
      e2e: ${{ steps.tier.outputs.e2e }}
    steps:
      - name: Pick the tier with the shared rule
        id: pick
        uses: AntelopeJS/.github/.github/actions/ci-tier@v2
      - name: Pick the tier from the event, the target branch and the draft flag
        id: tier
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY: ${{ github.repository }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
          TIER: ${{ steps.pick.outputs.tier }}
        run: |
          tier="$TIER"

          run=true
          if [[ "$tier" == none || "$tier" == draft ]]; then
            run=false
          fi

          windows='[]'
          if [[ "$tier" == nightly ]]; then
            windows='[{"os":"blacksmith-4vcpu-windows-2025"}]'
          fi

          e2e=full
          if [[ "$tier" == none || "$tier" == draft ]]; then
            e2e=none
          elif [[ "$EVENT" == pull_request && "$FULL_LABEL" != true ]] || [[ "$EVENT" == push ]]; then
            e2e=smoke
          fi

          {
            echo "tier=${tier}"
            echo "run=${run}"
            echo "windows=${windows}"
            echo "e2e=${e2e}"
          } >> "$GITHUB_OUTPUT"
          echo "Tier \`${tier}\`, e2e \`${e2e}\`" >> "$GITHUB_STEP_SUMMARY"

  backend:
    needs: select
    if: needs.select.outputs.run == 'true'
    name: backend${{ matrix.os == 'blacksmith-4vcpu-windows-2025' && ' on Windows' || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [blacksmith-4vcpu-ubuntu-2404]
        include: ${{ fromJSON(needs.select.outputs.windows) }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    steps:
      - name: Use LF line endings, symlinks and Git Bash for package scripts, as ci-node.yml does
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
          bash_path=$(cygpath -w /usr/bin/bash)
          echo "npm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"
          echo "pnpm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            packages/*/pnpm-lock.yaml

      # Backend-only job: do not install the Vue layer or playground. The
      # module reaches the interface package through a tarball, which pnpm's
      # filter graph does not follow, so the interface is selected by name.
      - run: pnpm install --filter @antelopejs/dms-marketing... --filter @antelopejs/interface-dms-marketing --frozen-lockfile

      # `ajs module test` packs and installs the package-sourced modules
      # (dms, api, auth-jwt...) into `.antelope/cache`, and mongodb-memory-server
      # downloads its mongod binary; both used to be fetched on every run.
      # Core installs each of them from its lockfile in antelope-lock/ and
      # reuses a cached module only when its version and its lockfile match
      # the record, so a restored folder installs the same dependencies as an
      # empty one; the key follows the pins and the records, not pnpm's
      # lockfiles.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/dms-marketing/.antelope/cache
          key: antelope-${{ runner.os }}-${{ hashFiles('packages/dms-marketing/antelope.test.ts', 'packages/dms-marketing/antelope-lock/**') }}
          restore-keys: antelope-${{ runner.os }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mongodb-binaries
          # The version pinned as MONGO_VERSION in antelope.test.ts.
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('packages/dms-marketing/antelope.test.ts') }}
          restore-keys: mongodb-binaries-${{ runner.os }}-

      # The only build of the job (interface first, then the module).
      # DMS_PREBUILT below makes the test script and the harness's
      # `installCommand` reuse it instead of building twice more.
      - run: pnpm --dir packages/dms-marketing build
      # `ajs module test .` boots the module against a real DMS, a
      # mongodb-memory replica set and the api module, once for the unit
      # tests and once for the HTTP journeys (`tests/*.journeys.js`).
      - run: pnpm --dir packages/dms-marketing test:backend
        env:
          DMS_PREBUILT: "1"
      - uses: AntelopeJS/.github/.github/actions/module-locks-committed@v2

  # Model-checks the ImportAnalytics claim and replay with TLC
  # (.agents/skills/formal-import-claim). Only the root package is installed:
  # the runner is @antelopejs/tooling-configs/formal.
  formal-import-claim:
    needs: select
    if: needs.select.outputs.run == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --filter dms-marketing-workspace --frozen-lockfile --ignore-scripts

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/antelopejs-formal
          key: tla2tools-1.7.4

      - run: node .agents/skills/formal-import-claim/check.mjs

  # The journeys of e2e/ as a Playwright suite: the @smoke ones on a ready
  # pull request, every journey in two shards on a merge_group run, a manual
  # dispatch, the nightly, and a pull request labelled `ci:full`. The kit's
  # global setup prepares and starts one run per shard.
  e2e:
    needs: select
    if: needs.select.outputs.e2e != 'none'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.select.outputs.e2e == 'full' && '[1, 2]' || '[1]') }}
    env:
      E2E: ${{ needs.select.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          echo "DMS_E2E_RUNS=${RUNNER_TEMP}/dms-runs" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            packages/*/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/mongodb-binaries
            ~/.cache/ms-playwright
          key: e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/dms-e2e/frontend
          key: e2e-frontend-v2-${{ github.sha }}
          restore-keys: e2e-frontend-v2-
      - name: Install Chromium and its system packages
        run: |
          if timeout 240 pnpm exec playwright install --with-deps --only-shell chromium; then
            exit 0
          fi
          echo "::warning::Chromium's system packages did not install: installing the browser alone"
          pnpm exec playwright install --only-shell chromium
      - if: env.E2E == 'smoke'
        run: pnpm e2e --grep @smoke
      - if: env.E2E == 'full'
        run: pnpm e2e --shard=${{ matrix.shard }}/2 --reporter=blob
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: e2e/blob-report
      # The journeys' types come from the declarations @antelopejs/dms/e2e publishes.
      - if: success() || failure()
        run: pnpm exec tsc --noEmit -p e2e
      - if: always() && env.E2E == 'full'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-${{ matrix.shard }}
          path: e2e/blob-report
          retention-days: 3
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-evidence-${{ matrix.shard }}
          path: |
            e2e/playwright-report
            e2e/test-results
            ${{ runner.temp }}/dms-runs/*/evidence
            ${{ runner.temp }}/dms-runs/*/logs
          retention-days: 7

  # One HTML and JSON report of the shards of a full run.
  e2e-report:
    needs: [select, e2e]
    if: always() && needs.select.outputs.e2e == 'full'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --filter dms-marketing-workspace --frozen-lockfile --ignore-scripts
      - id: download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-report-*
          path: e2e/blob-reports
          merge-multiple: true
      # The artifact service fails a download now and then, as in the 2026-11-26 nightly: one more attempt.
      - if: steps.download.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-report-*
          path: e2e/blob-reports
          merge-multiple: true
      - run: pnpm exec playwright merge-reports --reporter html,json e2e/blob-reports
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: e2e/playwright-report
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_JSON_OUTPUT_FILE: e2e/playwright-report/results.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14

  # The job name the branch protection requires: green only when every job
  # above is, a job the tier skipped excepted. A draft pull request fails it,
  # so merge-when-green cannot merge on the draft run.
  ubuntu:
    if: always()
    needs: [select, ci, backend, formal-import-claim, e2e, e2e-report]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - if: >-
          needs.select.result != 'success' || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || needs.ci.result == 'skipped' || (needs.select.outputs.run == 'true' && (needs.backend.result == 'skipped' || needs.formal-import-claim.result == 'skipped')) || (needs.select.outputs.e2e != 'none' && needs.e2e.result == 'skipped')
        run: exit 1
      - if: needs.select.outputs.tier == 'draft'
        run: |
          echo "::error::Draft pull request: only lint and typecheck ran. Mark it ready for review to run the tests."
          exit 1
  renovate-sync:
    if: >-
      github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      actions: write
      statuses: write
    uses: AntelopeJS/.github/.github/workflows/ci-renovate-sync.yml@v2

  module-locks:
    needs: [ci, backend]
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      actions: read
    uses: AntelopeJS/.github/.github/workflows/module-locks-renovate.yml@v2
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
  verdict:
    needs:
      - ci
      - select
      - backend
      - formal-import-claim
      - e2e
      - e2e-report
      - ubuntu
      - renovate-sync
      - module-locks
    if: ${{ !cancelled() }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail when a job failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | "\(.key): \(.value.result)"' <<< "$NEEDS")
          if [ -n "$failed" ]; then
            echo "$failed"
            exit 1
          fi
